name: Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validation:
    name: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FREECAD_APPIMAGE: FreeCAD_1.1.3-Linux-x86_64-py311.AppImage
      FREECAD_SHA256: 3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore pinned FreeCAD download
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/freecad
          key: freecad-1.1.3-linux-x86_64

      - name: Download pinned FreeCAD
        run: |
          mkdir -p .cache/freecad
          if [ ! -f ".cache/freecad/$FREECAD_APPIMAGE" ]; then
            curl --fail --location --retry 3 \
              --output ".cache/freecad/$FREECAD_APPIMAGE" \
              "https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/$FREECAD_APPIMAGE"
          fi
          echo "$FREECAD_SHA256  .cache/freecad/$FREECAD_APPIMAGE" | sha256sum --check --strict

      - name: Extract FreeCAD AppImage
        run: |
          chmod +x ".cache/freecad/$FREECAD_APPIMAGE"
          ".cache/freecad/$FREECAD_APPIMAGE" --appimage-extract >/dev/null

      - name: Validate generated geometry
        run: >-
          ./squashfs-root/usr/bin/freecadcmd --safe-mode --console
          "import runpy; runpy.run_path('tests/validate_models.py', run_name='__main__')"
